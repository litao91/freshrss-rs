[workspace]
resolver = "2"
members = [
    "crates/freshrss-search",
    "crates/freshrss-feed",
    "crates/freshrss-server",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "AGPL-3.0-or-later"

[workspace.dependencies]
# --- internal crates -------------------------------------------------------
freshrss-search = { path = "crates/freshrss-search", version = "0.1.0" }
freshrss-feed = { path = "crates/freshrss-feed", version = "0.1.0" }

# --- async / web -----------------------------------------------------------
axum = { version = "0.8.9", default-features = false, features = [
    "form", "http1", "http2", "json", "macros", "original-uri", "query", "tokio", "tracing",
] }
tokio = { version = "1.53.2", features = [
    "fs", "io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time",
] }
tower = { version = "0.5.3", features = ["util"] }
tower-http = { version = "0.7.1", features = [
    "compression-gzip", "fs", "set-header", "trace",
] }
hyper = "1.12.0"
http = "1.5.0"
bytes = "1.12.1"
futures = "0.3.34"

# --- storage ---------------------------------------------------------------
# `macros` is deliberately off: there is no compile-time database to check against, so every
# statement is a runtime `query`/`query_as` with a `FromRow` derive.
sqlx = { version = "0.9.0", default-features = false, features = [
    "derive", "migrate", "runtime-tokio", "sqlite",
] }

# --- http client -----------------------------------------------------------
reqwest = { version = "0.13.5", default-features = false, features = [
    "brotli", "charset", "cookies", "gzip", "http2", "json", "rustls", "stream",
] }

# --- serialization / errors / logs ----------------------------------------
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
anyhow = "1.0.104"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }

# --- parsing / text --------------------------------------------------------
quick-xml = { version = "0.42.0", features = ["serialize"] }
ammonia = "4.2.3"
scraper = "0.27.0"
html-escape = "0.2.15"
regex = "1.13.1"
fancy-regex = "0.19.2"
unicode-normalization = "0.1.25"
url = "2.5.8"
percent-encoding = "2.3.2"
jiff = "0.2.38"
xpath-eval = "0.2.2"
async-trait = "0.1.92"

# --- crypto / ids ----------------------------------------------------------
md-5 = "0.11.0"
sha1 = "0.11.0"
base64 = "0.23.1"
hex = "0.4.3"
argon2 = "0.6.0"
uuid = { version = "1.28.0", features = ["v4"] }

# --- misc ------------------------------------------------------------------
clap = { version = "4.6.7", features = ["derive", "env"] }
figment = { version = "0.10.19", features = ["toml", "env"] }
rust-embed = { version = "8.13.0", features = ["axum"] }
mime_guess = "2.0.5"
once_cell = "1.21.4"
flate2 = "1.1.10"
# The retention throttle: PHP's `rand(0, 30) === 1`, which spreads the cleanup cost across
# refreshes instead of paying it on every one.
rand = "0.10.3"

# --- dev -------------------------------------------------------------------
proptest = "1.12.0"
insta = { version = "1.49.0", features = ["json"] }
tempfile = "3.27.0"
feed-rs = "3.0.0"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[profile.dev]
debug = 1
